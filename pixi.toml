[workspace]
authors = ["HoWilgh <wilfried.hortschitz@donau-uni.ac.at>"]
channels = ["conda-forge"]
name = "to-nomad"
platforms = ["linux-64"]
version = "0.1.1"

[tasks]
# Install the local package in editable mode so that `import to_nomad` works.
install = "pip install -e . --no-deps"
# Quick smoke-test: generate a sample archive YAML and print it.
example = "python examples/quickstart.py"
# Safe NOMAD API upload (dry-run by default; --yes for the real transfer).
upload = "python -m to_nomad.upload_to_nomad"

[dependencies]
python = ">=3.14.3,<3.15"
mammos-entity = ">=0.14,<0.15"
pyyaml = ">=6.0"
hatchling = "*"
tifffile = "*"
ase = "*"

[pypi-dependencies]
to-nomad = { path = ".", editable = true }

# Optional development-only environment for local NOMAD validation.
# NOT installed for regular users: `pixi install` (default) only creates the
# default environment; this one is created on first use of `-e nomad-test`.
[feature.nomad-test.pypi-dependencies]
# Match the central nomad-lab.eu instance (GET /info -> version 2.0.0,
# verified 2026-10-22). 2.0.0's base install misses the zipstream
# dependency and (like 1.4.3) requires fastapi, both added below.
nomad-lab = ">=2.0,<2.1"
zipstream-ng = "*"
fastapi = "*"
# Provides the 'RunSchema' nomad.plugin entry point. Without it,
# nomad.datamodel.metainfo.runschema stays None and the
# ElnWithStructureFile base section (structure_file / CIF preview)
# crashes with "'NoneType' object has no attribute 'run'".
nomad-schema-plugin-run = "*"

[feature.nomad-test.tasks]
parse = "nomad parse --parser parsers/archive --show-archive"
validate = "python scripts/validate_archive_locally.py"

[environments]
nomad-test = ["nomad-test"]
