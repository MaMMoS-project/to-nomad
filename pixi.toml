[workspace]
authors = ["HoWilgh <wilfried.hortschitz@donau-uni.ac.at>"]
channels = ["conda-forge"]
name = "to-nomad"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Install the local package in editable mode so that `import to_nomad` works.
install = "pip install -e . --no-deps"
# Quick smoke-test: generate a sample archive YAML and print it.
example = "python examples/quickstart.py"

[dependencies]
python = ">=3.14.3,<3.15"
mammos-entity = ">=0.14,<0.15"
pyyaml = ">=6.0"
hatchling = "*"

[pypi-dependencies]
to-nomad = { path = ".", editable = true }
