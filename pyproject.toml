[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "to-nomad"
version = "0.1.0"
description = "Convert mammos-entity data to NOMAD archive YAML for upload"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "HoWilgh", email = "wilfried.hortschitz@donau-uni.ac.at" },
]
requires-python = ">=3.10"
dependencies = [
    "mammos-entity>=0.14,<0.15",
    "pyyaml>=6.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipython",
    "jupyterlab",
]

[tool.hatch.build.targets.wheel]
packages = ["src/to_nomad"]
